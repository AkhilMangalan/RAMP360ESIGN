<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>RAMP360 Email Signature Generator</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Noto Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
  margin: 0;
  min-height: 100vh;
  font-family: Noto Sans;
  background: url("https://raw.githubusercontent.com/AkhilMangalan/RAMP360ESIGN/main/hero.png")
              no-repeat center center fixed;
  background-size: cover;
}

/* White glass card for the app */
/*.app {
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(4px);
  min-height: 100vh;
}*/

    .app {
      width: 100%;
      min-height: 100vh;
      padding: 40px 60px;
      box-sizing: border-box;
      background: #ffffff;
    }

    h1 { color:#102a4c; margin-bottom:20px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    input {
      width:100%;
      padding:10px;
      margin-bottom:12px;
      border-radius:6px;
      border:1px solid #ccc;
      font-size:14px;
      font-family:'Noto Sans';
    }

    button {
      width:100%;
      margin-top:10px;
      padding:10px;
      border:none;
      border-radius:6px;
      background:#102a4c;
      color:#6bbe45;
      font-weight:600;
      cursor:pointer;
      font-family:'Noto Sans';
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react" src="email_signature_generator.jsx"></script>
</body>
</html>
